[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "private-ai-agent"
version = "0.2.0"
description = "Enterprise-style private RAG agent with LangGraph + Chroma."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.8",
    "langchain>=1.2.17",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.1",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.1.0",
    "langchain-text-splitters>=1.0.0",
    "langgraph>=1.1.10",
    "pypdf>=6.10.2",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.12.0",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[project.scripts]
private-agent = "private_agent.main:main"
private-agent-ingest = "private_agent.ingest:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
